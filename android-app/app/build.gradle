plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codex.shinsegaeattendance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codex.shinsegaeattendance'
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName '1.7.25'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
